<div class="app-layout">
  <header class="app-navbar glass-card">
    <div class="navbar-container">
      <a routerLink="/" class="navbar-brand">
        <span class="brand-icon">⚡</span>
        <span class="brand-title">MVStudio <span class="brand-highlight">Quiz</span></span>
      </a>

      <div class="navbar-actions">
        <button 
          type="button" 
          class="btn-theme-toggle" 
          [title]="isDarkMode ? 'Cambiar a Tema Claro' : 'Cambiar a Tema Oscuro'"
          (click)="toggleTheme()">
          @if (isDarkMode) {
            <span class="theme-icon">☀️</span>
            <span class="theme-text">Modo Claro</span>
          } @else {
            <span class="theme-icon">🌙</span>
            <span class="theme-text">Modo Oscuro</span>
          }
        </button>
      </div>
    </div>
  </header>

  <main class="app-content">
    <router-outlet></router-outlet>
  </main>

  <footer class="app-footer">
    <p>© 2026 MVStudio — Autoevaluación Final Programador Web (Angular, DRF & Metodologías)</p>
  </footer>
</div>
